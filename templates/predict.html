<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Sentiment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(-45deg, #000000, #ffffff, #000000, #ff001e);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            overflow: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            text-align: center;
            background: rgb(30, 30, 30);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        textarea {
            width: 90%;
            height: 120px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #555;
            font-size: 16px;
            resize: none;
            background: #222;
            color: white;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(-45deg,  #000000, #ffffff, #000000, #ff001e);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        button:hover {
            transform: scale(1.1);
        }
        button:active {
            transform: scale(0.95);
        }
        .animated-figures {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .circle, .square, .triangle {
            position: absolute;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }
        .circle {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }
        .square {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.5);
        }
        .triangle {
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid rgba(255, 255, 255, 0.5);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="animated-figures">
        <div class="circle" style="top: 10%; left: 15%; animation-duration: 8s;"></div>
        <div class="square" style="top: 50%; left: 60%; animation-duration: 12s;"></div>
        <div class="triangle" style="top: 80%; left: 30%; animation-duration: 10s;"></div>
        <div class="circle" style="top: 25%; left: 85%; animation-duration: 9s;"></div>
        <div class="square" style="top: 65%; left: 40%; animation-duration: 11s;"></div>
    </div>
    <div class="container">
        <h1>Enter Your Message</h1>
        <form action="/predict" method="POST">
            <textarea id="message" name="message" placeholder="Type your message here..."></textarea>
            <button type="submit">Know Sentiment</button>
        </form>
    </div>
</body>
</html>
